app:
  # Logging level for the application | type=str | choices=['DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL']
  log_level: 'INFO'
  # Enable logging to a file | type=bool
  enable_file_logging: true
  # Enable logging to the console | type=bool
  enable_console_logging: true

paths:
  # Default directory that contains the source images | type=str | CLI
  source_dir: '/home/paul/Pictures'
  # Root directory below which export folders are created | type=str | CLI
  output_root: '/home/paul/Pictures'

export:
  # Export image format | type=str | choices=['jpg', 'png'] | CLI
  format: 'jpg'
  # JPEG quality (1-100) | type=int | CLI
  jpg_quality: 85
  # Resize images so the longest side matches max_long_side | type=bool | CLI
  reduce_resolution: false
  # Longest side in pixels when reducing resolution | type=int | CLI
  max_long_side: 1200

server:
  # Host interface the web UI binds to | type=str | CLI
  host: '127.0.0.1'
  # Port the web UI listens on | type=int | CLI
  port: 8765
  # Open the web UI in the default browser on start | type=bool | CLI
  open_browser: true
