name: CI

# Linux is the quality gate for every push and pull request. There are no
# Windows/macOS jobs: the project only ships a Linux binary.

on:
  push:
    branches:
      - main
      - 'ci/**'
    paths-ignore:
      - 'HISTORY.md'
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs for the same ref are cancelled, so the latest commit
  # gets its result sooner and no CI minutes are wasted on stale pushes.
  cancel-in-progress: true

jobs:
  tests:
    name: Linux / lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run linter and tests
        run: make test