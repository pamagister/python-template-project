name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ main ]
    # The release commit (HISTORY.md only) is covered by the release
    # pipeline's quality gate; no need to re-run the full CI here.
    paths-ignore:
      - 'HISTORY.md'
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'

      - name: Run linter
        run: make lint

  tests-ubuntu:
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'

      - name: Run tests
        run: make test

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v7
