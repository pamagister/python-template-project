name: Release

# Triggered by a tag push, normally created by `make release`.
#
# Linux-only release:
#   make release
#
# The workflow runs the quality gate, creates the GitHub release, publishes to
# PyPI and builds the Linux executable. There are no Windows/macOS artifacts.

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quality gate: lint + unit tests before any release artifact is created.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run quality gate (lint + tests)
        run: make test

  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Changelog
        run: .github/release_message.sh > release_message.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_message.md

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m build
          twine upload dist/*

  # The Linux build is part of every release. It uploads its archive to the
  # GitHub release, so it waits for the `release` job to finish.
  build-linux:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Build Linux Executable with PyInstaller
        run: make build-linux
      - name: Prepare ZIP file for release
        run: |
          cd release
          zip -r ../package-linux.zip .
      - name: Upload ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: package-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}